name: AIJOBS Candidate Signed Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.AIJOBS_KEYSTORE_BASE64 }}
          AIJOBS_KEYSTORE_PASSWORD: ${{ secrets.AIJOBS_KEYSTORE_PASSWORD }}
          AIJOBS_KEY_ALIAS: ${{ secrets.AIJOBS_KEY_ALIAS }}
          AIJOBS_KEY_PASSWORD: ${{ secrets.AIJOBS_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 AIJOBS_KEYSTORE_PASSWORD AIJOBS_KEY_ALIAS AIJOBS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aijobs-release.jks"
          chmod 600 "$RUNNER_TEMP/aijobs-release.jks"
      - name: Build signed release APK and Play bundle
        env:
          AIJOBS_KEYSTORE_PATH: ${{ runner.temp }}/aijobs-release.jks
          AIJOBS_KEYSTORE_PASSWORD: ${{ secrets.AIJOBS_KEYSTORE_PASSWORD }}
          AIJOBS_KEY_ALIAS: ${{ secrets.AIJOBS_KEY_ALIAS }}
          AIJOBS_KEY_PASSWORD: ${{ secrets.AIJOBS_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          chmod +x android/gradlew
          npm run android:sync
          cd android
          ./gradlew assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: aijobs-candidate-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
