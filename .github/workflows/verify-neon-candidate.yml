name: AIJOBS Neon Candidate and Integrations Build

on:
  push:
    branches: [feature/aijobs-candidate-neon-release]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
