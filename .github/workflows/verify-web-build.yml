name: Verify Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: auth.aijobs1.in
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean production build
        run: |
          rm -rf dist
          npm run build

      - name: Verify Firebase Auth domain in production bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -F "planning-with-ai-1ea1c.firebaseapp.com" dist; then
            echo "Old Firebase Auth domain is still present in the production bundle."
            exit 1
          fi
          if ! grep -R -F "auth.aijobs1.in" dist >/dev/null; then
            echo "Custom Firebase Auth domain is missing from the production bundle."
            exit 1
          fi
          echo "Production bundle uses auth.aijobs1.in and does not contain the old Firebase Auth domain."

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit
