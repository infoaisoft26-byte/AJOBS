  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#glassBg)" stroke="url(#electricCore)" stroke-width="3" stroke-opacity="0.8" />

  <path d="M20 25 H40 M60 25 H80 M15 75 H35 M65 75 H85 M25 15 V35 M75 15 V35" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3" />

  <path d="M 50 16 L 22 80 H 38 L 50 50 Z" fill="url(#metallicSilver)" />
  <path d="M 50 16 L 78 80 H 62 L 50 50 Z" fill="url(#electricCore)" />
