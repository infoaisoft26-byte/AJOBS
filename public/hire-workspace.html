<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiring Workspace | AIJOBS</title><style>*{box-sizing:border-box}body{margin:0;background:#06142d;color:#fff;font-family:Inter,system-ui,sans-serif}.w{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.muted{color:#94a3b8;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.panel{background:#0a1b37;border:1px solid #1f3658;border-radius:16px;padding:16px}.n{font-size:28px;font-weight:900;margin-top:6px}.btn{display:inline-block;border:1px solid #294466;background:#102542;color:#dbeafe;border-radius:11px;padding:9px 12px;text-decoration:none;cursor:pointer;font-weight:700;font-size:12px}.primary{background:#2563eb;border-color:#3b82f6;color:#fff}.danger{background:#7f1d1d}.tabs{display:flex;gap:8px;margin:18px 0}.tab.on{background:#2563eb}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #20314d;text-align:left}.scroll{overflow:auto}.hidden{display:none}.notice{margin:14px 0;padding:12px;border-radius:12px;background:#0e2448;color:#bfdbfe}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="w"><div class="top"><div><div class="brand">AIJOBS Hiring Workspace</div><div id="who" class="muted">Loading account…</div></div><div><a id="postBtn" class="btn primary" href="/hire/recruiter">+ Post New Job</a> <a class="btn" href="/">AIJOBS Home</a></div></div><div id="msg" class="notice">Connecting securely…</div><div id="cards" class="cards"></div><div class="tabs"><button class="btn tab on" data-x="jobs">Jobs</button><button class="btn tab" data-x="apps">Applications</button></div><section id="jobs" class="panel"><div class="scroll"><table class="table"><thead><tr><th>Job Title</th><th>Status</th><th>Applicants</th><th>Views</th><th>Created</th><th>Expiry</th><th>Action</th></tr></thead><tbody id="jobRows"></tbody></table></div></section><section id="apps" class="panel hidden"><div class="scroll"><table class="table"><thead><tr><th>Candidate</th><th>Mobile</th><th>Email</th><th>Location</th><th>Experience</th><th>Applied Job</th><th>Date</th><th>Status</th></tr></thead><tbody id="appRows"></tbody></table></div></section></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';const cfg=await(await fetch('/firebase-applet-config.json',{cache:'no-store'})).json(),auth=getAuth(initializeApp(cfg)),msg=document.getElementById('msg');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const u=auth.currentUser;if(!u)throw new Error('Please login with your Recruiter, Employer or Consultancy account.');const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${await u.getIdToken(true)}`,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}async function load(){const x=await api('/api/hire/workspace'),s=x.stats,p=x.profile;document.getElementById('who').textContent=`${p.name||'Hiring Partner'} · ${p.role} · ${p.email||''}`;document.getElementById('postBtn').href=`/hire/${p.role}`;document.getElementById('cards').innerHTML=[['Active Jobs',s.activeJobs],['Pending Jobs',s.pendingJobs],['Expired / Closed',s.expiredJobs],['Applications',s.applications],['Shortlisted',s.shortlisted],['Interviews',s.interviews],['Hired',s.hired],['Available Job Credits',s.availableJobCredits]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="n">${b||0}</div></div>`).join('');document.getElementById('jobRows').innerHTML=x.jobs.length?x.jobs.map(j=>`<tr><td><b>${esc(j.title)}</b><div class="muted">${esc(j.companyName)}</div></td><td>${esc(j.status)}</td><td>${j.applicantsCount||j.applicationCount||0}</td><td>${j.viewsCount||0}</td><td>${esc(String(j.createdAt||'').slice(0,10))}</td><td>${esc(String(j.expiryDate||j.validThrough||'').slice(0,10))}</td><td><a class="btn" href="${j.publicUrl||('/?jobId='+encodeURIComponent(j.id))}">View</a> ${!['closed','expired'].includes(String(j.status).toLowerCase())?`<button class="btn danger close" data-id="${esc(j.id)}">Close</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7">No jobs yet. Post your first job free.</td></tr>';document.getElementById('appRows').innerHTML=x.applications.length?x.applications.map(a=>`<tr><td><b>${esc(a.candidateName)}</b></td><td>${esc(a.candidatePhone||a.phone)}</td><td>${esc(a.candidateEmail||a.email)}</td><td>${esc(a.candidateLocation||a.location)}</td><td>${esc(a.candidateExperience||a.experience)}</td><td>${esc(a.jobTitle)}</td><td>${esc(String(a.appliedAt||a.createdAt||'').slice(0,10))}</td><td><select class="status" data-id="${esc(a.id)}"><option>${esc(a.status||'applied')}</option><option value="viewed">Viewed</option><option value="shortlisted">Shortlisted</option><option value="interview_scheduled">Interview Scheduled</option><option value="selected">Selected</option><option value="rejected">Rejected</option><option value="hired">Hired</option></select></td></tr>`).join(''):'<tr><td colspan="8">No applications yet.</td></tr>';document.querySelectorAll('.close').forEach(b=>b.onclick=async()=>{if(!confirm('Close this job?'))return;try{await api(`/api/hire/workspace/jobs/${b.dataset.id}/close`,{method:'POST',body:'{}'});msg.textContent='Job closed.';await load()}catch(e){msg.textContent=e.message}});document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{try{await api(`/api/hire/workspace/applications/${s.dataset.id}/status`,{method:'POST',body:JSON.stringify({status:s.value})});msg.textContent='Application status updated.'}catch(e){msg.textContent=e.message;await load()}});msg.textContent='Live hiring data loaded.'}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.getElementById('jobs').classList.toggle('hidden',t.dataset.x!=='jobs');document.getElementById('apps').classList.toggle('hidden',t.dataset.x!=='apps')});onAuthStateChanged(auth,u=>{if(!u){msg.innerHTML='Hiring session not found. <a style="color:#67e8f9" href="/portal-login">Login</a>';return}load().catch(e=>msg.textContent=e.message)});</script></body></html>
