<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiring Verification | AIJOBS Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050b18;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}.head h1{margin:0;font-size:26px}.muted{color:#94a3b8;font-size:12px}.tabs{display:flex;gap:10px;margin:18px 0}.btn,.tab{border:1px solid #243552;background:#0b1730;color:#cbd5e1;border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:700}.tab.on,.btn.primary{background:#2563eb;color:white;border-color:#3b82f6}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.job{background:#09152b;border:1px solid #1d2d4c;border-radius:16px;padding:16px}.metric{font-size:26px;font-weight:900;margin-top:6px}.job{margin:12px 0}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.ok{background:#065f46}.bad{background:#881337}.warn{background:#854d0e}.hidden{display:none}.notice{padding:12px;border-radius:12px;margin:12px 0;background:#111d34;color:#bfdbfe}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid #1e293b;text-align:left}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="head"><div><h1>AIJOBS Hiring Control</h1><div class="muted">Verification Queue & Recruiter Acquisition · Production data only</div></div><a class="btn" href="/admin/dashboard">Back to Admin</a></div><div id="msg" class="notice">Checking Admin session…</div><div class="tabs"><button class="tab on" data-target="queue">Verification Queue</button><button class="tab" data-target="analytics">Recruiter Acquisition</button></div><section id="queue"><div id="queueList"></div></section><section id="analytics" class="hidden"><div id="metrics" class="cards"></div><div class="card" style="margin-top:14px;overflow:auto"><table class="table"><thead><tr><th>Source</th><th>Medium</th><th>Campaign</th><th>Content</th><th>Registrations</th><th>Jobs Submitted</th><th>Jobs Approved</th><th>Reg→Approved</th></tr></thead><tbody id="campaignRows"></tbody></table></div></section></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';let cfg=await(await fetch('/firebase-applet-config.json',{cache:'no-store'})).json();const auth=getAuth(initializeApp(cfg));const msg=document.getElementById('msg');const api=async(url,opt={})=>{const u=auth.currentUser;if(!u)throw new Error('Admin login required.');const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${await u.getIdToken(true)}`,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};function e(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadQueue(){const out=await api('/api/hire/admin/queue');const box=document.getElementById('queueList');box.innerHTML=out.jobs.length?out.jobs.map(j=>`<div class="job"><div class="row"><div><b>${e(j.title)}</b><div class="muted">${e(j.companyName)} · ${e(j.location)} · ${e(j.submittedByRole)}</div><div class="muted">Posted by ${e(j.postedByName)} · ${e(j.postedByEmail)} · ${e(j.postedByPhone)}</div></div><div><b>Status</b><div class="muted">${e(j.status)}</div><div class="muted">Openings: ${e(j.openings)}</div></div><div><b>Client</b><div class="muted">${e(j.clientCompanyName||'Own Company')}</div><div class="muted">${e(j.createdAt||'')}</div></div></div><div class="actions"><button class="btn ok" data-a="approve" data-id="${e(j.id)}">Approve</button><button class="btn warn" data-a="request_changes" data-id="${e(j.id)}">Request Changes</button><button class="btn bad" data-a="reject" data-id="${e(j.id)}">Reject</button></div></div>`).join(''):'<div class="card">No jobs waiting for verification.</div>';box.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const action=b.dataset.a,id=b.dataset.id;let body={action};if(action==='reject'){const reason=prompt('Rejection reason:');if(!reason)return;body.reason=reason}if(action==='request_changes'){const message=prompt('Required changes:');if(!message)return;body.message=message}b.disabled=true;try{const r=await api(`/api/hire/admin/jobs/${id}/review`,{method:'POST',body:JSON.stringify(body)});msg.textContent=`Job ${r.status}${r.publicUrl?' · '+r.publicUrl:''}`;await loadQueue();await loadAnalytics()}catch(x){msg.textContent=x.message}finally{b.disabled=false}})}async function loadAnalytics(){const x=await api('/api/hire/admin/analytics'),t=x.totals;document.getElementById('metrics').innerHTML=[['Registrations',t.registrations],['Employers',t.employerRegistrations],['Recruiters',t.recruiterRegistrations],['Consultancies',t.consultancyRegistrations],['Jobs Submitted',t.firstJobsSubmitted],['Approved',t.jobsApproved],['Rejected',t.jobsRejected]].map(a=>`<div class="card"><div class="muted">${a[0]}</div><div class="metric">${a[1]||0}</div></div>`).join('');document.getElementById('campaignRows').innerHTML=x.byCampaign.map(r=>`<tr><td>${e(r.source)}</td><td>${e(r.medium)}</td><td>${e(r.campaign)}</td><td>${e(r.content)}</td><td>${r.registrations}</td><td>${r.jobsSubmitted}</td><td>${r.jobsApproved}</td><td>${r.registrations?((r.jobsApproved/r.registrations)*100).toFixed(1):0}%</td></tr>`).join('')}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.getElementById('queue').classList.toggle('hidden',t.dataset.target!=='queue');document.getElementById('analytics').classList.toggle('hidden',t.dataset.target!=='analytics')});onAuthStateChanged(auth,async u=>{if(!u){msg.innerHTML='Admin session not found. <a style="color:#67e8f9" href="/admin/login">Login as Admin</a>';return}try{await Promise.all([loadQueue(),loadAnalytics()]);msg.textContent='Live Firestore data loaded.'}catch(x){msg.textContent=x.message}});</script></body></html>
